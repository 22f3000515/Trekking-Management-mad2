
    <!DOCTYPE html>
    <html>
    <head>
        <title>Monthly Trekking Activity Report</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            h1 {
                text-align: center;
            }

            .summary {
                display: flex;
                gap: 20px;
                margin: 30px 0;
            }

            .card {
                border: 1px solid #ddd;
                padding: 20px;
                flex: 1;
                text-align: center;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }

            th, td {
                border: 1px solid #ddd;
                padding: 10px;
            }

            th {
                background-color: #f2f2f2;
            }
        </style>
    </head>

    <body>

        <h1>Monthly Trekking Activity Report</h1>

        <p>
            Report Period:
            8/2026
        </p>

        <div class="summary">

            <div class="card">
                <h2>0</h2>
                <p>Treks Conducted</p>
            </div>

            <div class="card">
                <h2>0</h2>
                <p>Total Participants</p>
            </div>

        </div>

        <h2>Popular Treks</h2>

        <table>

            <tr>
                <th>Rank</th>
                <th>Trek Name</th>
                <th>Participants</th>
            </tr>
    
        </table>

    </body>
    </html>
